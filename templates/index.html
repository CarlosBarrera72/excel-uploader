<!DOCTYPE html>
<html>
<head>
    <title>Excel Uploader</title>
</head>
<body>

    <h1>Upload Excel File</h1>

    <form action="/upload" method="POST" enctype="multipart/form-data">
        <input type="file" name="file" accept=".xlsx,.csv">
        <button type="submit">Upload</button>
    </form>

</body>
</html>
