<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Uploader</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Excel / CSV Uploader</h1>

        <form id="upload-form">
            <input type="file" id="file-input" name="file" accept=".xlsx,.csv" required>
            <button type="submit">Upload</button>
        </form>

        <p id="status"></p>

        <div id="preview-section" class="hidden">
            <h2>Preview Uploaded File</h2>
            <p>Click a row number to use that row as the header row.</p>
            <div id="preview-table-container"></div>
        </div>

        <div id="columns-section" class="hidden">
            <h2>Select Columns</h2>
            <p>Click the column names in the order you want them displayed.</p>
            <div id="columns-list"></div>
            <button id="process-btn" type="button">Process File</button>
        </div>

        <div id="table-section" class="hidden">
            <h2>Processed Data</h2>
            <div id="table-container"></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
